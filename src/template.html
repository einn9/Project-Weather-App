<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <form id="signup-form">
        <label for="locationInput" id="location">Search Location</label>
        <input type="text"  id="locationInput" name="location" required/>
        <input type="submit" value="Submit" />
    </form>

    <div id="weather">
        <h1 id="city"></h1>
        <h1 id="temperature"></h1>
        <h1 id="conditions"></h1>
        <h1 id="humidity"></h1>
    </div>
</body>
</html>
